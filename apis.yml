aid: adchem4f3e
name: ADChem Semi-Tech
description: >-
  Anhui ADChem Semi-Tech Co., Ltd. (安徽安德科铭半导体科技股份有限公司) is a Hefei, China
  based manufacturer of electronic-grade semiconductor thin-film precursor materials, founded
  in 2018 and operating an R&D base in Hefei with production sites in Tongling plus sales and
  market-development offices in Shanghai and Wuhan. The company develops and produces
  high-purity ALD and CVD precursors — silicon-based precursors (BDEAS, BTBAS, DIPAS, DIS),
  High-K hafnium and zirconium precursors (TDMAHf, TEMAHf, CpHf, HfCl4, TEMAZ, CpZr, ZrCl4),
  metal and conductive-film precursors (TMA, TBTDEN, WCl5, MoCl5, CCTBA, Ru(EtCp)2) and
  perovskite photovoltaic precursors — alongside custom source canisters, liquid delivery
  systems and thin-film process solutions for integrated-circuit manufacturing, advanced
  display and new-energy customers. ADChem sells physical chemical products; it operates no
  public developer program, API, or software platform.
